services:
  db:
    image: postgres:16-alpine
    container_name: dorm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${DB_PASSWORD:-booking_secure_pw}
      POSTGRES_DB: booking
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/deploy/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./backend/deploy/migrations/002_tg_links.sql:/docker-entrypoint-initdb.d/002_tg_links.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dorm_backend
    restart: unless-stopped
    environment:
      HTTP_ADDR: "0.0.0.0:8080"
      DB_URL: "postgres://booking:${DB_PASSWORD:-booking_secure_pw}@db:5432/booking?sslmode=disable"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      BACKEND_INTERNAL_URL: "http://dorm_backend:8080"
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - services_default

  frontend:
    build:
      context: ./frontend
    container_name: dorm_frontend
    restart: unless-stopped
    networks:
      - internal
      - services_default

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: dorm_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://booking:${DB_PASSWORD:-booking_secure_pw}@db:5432/booking?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  prometheus:
    image: prom/prometheus:latest
    container_name: dorm_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    container_name: dorm_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://grafana.dubki.fun"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - internal
      - services_default

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
  services_default:
    external: true
